<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiosco Comercial</title>

    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: white;
            color: black;
        }


        /* =========================
           ENCABEZADO
        ========================== */

        header {
            height: 75px;
            background-color: #7B2CBF;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .busqueda {
            display: flex;
            gap: 8px;
        }

        .busqueda input {
            width: 250px;
            padding: 10px;

            border: none;
            border-radius: 6px;

            font-size: 15px;
        }

        .btn-buscar,
        .btn-ayuda {
            border: none;
            padding: 10px 15px;

            border-radius: 6px;

            cursor: pointer;
            font-weight: bold;
        }

        .btn-buscar {
            background-color: #2196F3;
            color: white;
        }

        .btn-ayuda {
            background-color: white;
            color: #7B2CBF;
        }


        /* =========================
           ESTRUCTURA PRINCIPAL
        ========================== */

        .contenedor {
            display: flex;
            min-height: calc(100vh - 75px);
        }
datos-alumno {

            background: #f3f3f3;

            padding: 18px 25px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            border-bottom:
                3px solid #6A0DAD;

        }

/*datos del alumno*/ 

        .datos-alumno input {

            width: 100%;

            padding: 12px;

            border:
                1px solid #aaa;

            border-radius: 8px;

            outline: none;

        }

        /* =========================
           MENÚ LATERAL
        ========================== */

        .menu {
            width: 230px;

            background-color: #f3e8ff;

            border-right: 4px solid #7B2CBF;

            padding: 25px 15px;
        }

        .menu h2 {
            color: #7B2CBF;
            margin-bottom: 20px;

            text-align: center;
        }

        .boton-menu {
            width: 100%;

            background-color: #7B2CBF;
            color: white;

            border: none;

            padding: 13px;
            margin-bottom: 12px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;
        }

        .boton-menu:hover {
            background-color: #5A189A;
        }


        /* =========================
           CONTENIDO
        ========================== */

        .contenido {
            flex: 1;

            padding: 25px;

            background-color: white;
        }

        #titulo {
            color: #7B2CBF;

            margin-bottom: 20px;

            border-bottom: 3px solid #2196F3;

            padding-bottom: 10px;
        }


        /* =========================
           TABLA DE PRODUCTOS
        ========================== */

        table {
            width: 100%;

            border-collapse: collapse;

            margin-bottom: 30px;
        }

        th {
            background-color: #7B2CBF;
            color: white;

            padding: 13px;

            text-align: left;
        }

        td {
            border-bottom: 1px solid #ddd;

            padding: 13px;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .precio {
            color: #2196F3;
            font-weight: bold;
        }

        .btn-agregar {
            background-color: #2196F3;

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;

            font-weight: bold;
        }

        .btn-agregar:hover {
            background-color: #1976D2;
        }


        /* =========================
           CARRITO
        ========================== */

        .carrito {
            border: 2px solid #7B2CBF;

            border-radius: 10px;

            padding: 20px;

            background-color: #fafafa;
        }

        .carrito h2 {
            color: #7B2CBF;

            margin-bottom: 15px;
        }

        #listaCarrito {
            list-style: none;

            margin-bottom: 15px;
        }

        #listaCarrito li {
            padding: 10px;

            border-bottom: 1px solid #ddd;

            display: flex;
            justify-content: space-between;
        }

        .total {
            color: #2196F3;

            font-size: 22px;

            font-weight: bold;

            margin-top: 15px;
        }

        .btn-whatsapp {
            margin-top: 15px;

            width: 100%;

            background-color: #25D366;

            color: white;

            border: none;

            padding: 14px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 17px;

            font-weight: bold;
        }

        .btn-whatsapp:hover {
            background-color: #1da851;
        }

        .btn-eliminar {
            background-color: #e63946;

            color: white;

            border: none;

            border-radius: 4px;

            padding: 4px 7px;

            cursor: pointer;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 700px) {

            header {
                height: auto;

                padding: 15px;

                flex-direction: column;

                gap: 12px;
            }

            .busqueda {
                width: 100%;
            }

            .busqueda input {
                width: 100%;
            }

            .contenedor {
                flex-direction: column;
            }

            .menu {
                width: 100%;

                border-right: none;

                border-bottom: 4px solid #7B2CBF;
            }

            .contenido {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     ENCABEZADO
========================== -->

<header>

    <div class="logo">
        🏫Kiosco Comercial 
    </div>

    <div class="busqueda">

        <input
            type="text"
            id="buscador"
            placeholder="Buscar producto..."
        >

        <button
            class="btn-buscar"
            onclick="buscarProducto()"
        >
            🔎 Buscar
        </button>

        <button
            class="btn-ayuda"
            onclick="mostrarAyuda()"
        >
            ❓ Ayuda
        </button>

    </div>

</header>

<!-- ==========================================
     DATOS DEL ALUMNO
========================================== -->

<section class="datos-alumno">

    <input
        type="text"
        id="nombre"
        placeholder="Nombre del alumno"
    >


    <input
        type="text"
        id="apellido"
        placeholder="Apellido del alumno"
    >


    <input
        type="text"
        id="curso"
        placeholder="Curso"
    >


    <input
        type="tel"
        id="telefono"
        placeholder="Número de teléfono"
        inputmode="tel"
    >

</section>

<!-- =========================
     CONTENEDOR PRINCIPAL
========================== -->

<div class="contenedor">


    <!-- =========================
         MENÚ LATERAL
    ========================== -->

    <aside class="menu">

        <h2>☰ Menú</h2>

        <button
            class="boton-menu"
            onclick="mostrarCategoria('bebidas')"
        >
            🥤 Bebidas
        </button>

        <button
            class="boton-menu"
            onclick="mostrarCategoria('comida')"
        >
            🍔 Comida
        </button>

        <button
            class="boton-menu"
            onclick="mostrarCategoria('golosinas')"
        >
            🍫 Golosinas
        </button>

        <button
            class="boton-menu"
            onclick="mostrarCategoria('snacks')"
        >
            🍿 Snacks
        </button>

    </aside>



    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="contenido">

        <h1 id="titulo">
            Selecciona una categoría
        </h1>


        <!-- TABLA -->

        <table>

            <thead>

                <tr>

                    <th>
                        Producto
                    </th>

                    <th>
                        Precio
                    </th>

                    <th>
                        Comprar
                    </th>

                </tr>

            </thead>

            <tbody id="tablaProductos">

                <tr>

                    <td colspan="3">
                        Selecciona una categoría del menú.
                    </td>

                </tr>

            </tbody>

        </table>



        <!-- =========================
             CARRITO
        ========================== -->

        <div class="carrito">

            <h2>
                🛒 Mi carrito
            </h2>

            <ul id="listaCarrito">

                <li>
                    El carrito está vacío.
                </li>

            </ul>

            <div class="total">

                Total:
                <span id="total">
                    $0
                </span>

            </div>


            <button
                class="btn-whatsapp"
                onclick="finalizarCompra()"
            >
                📱 Finalizar compra por WhatsApp
            </button>

        </div>

    </main>

</div>



<script>


/* =========================
   PRODUCTOS DE LA TIENDA
========================== */

const productos = {

    bebidas: [

        {
            nombre: "Coca Cola",
            precio: 2500
        },

        {
            nombre: "Sprite",
            precio: 2200
        },

        {
            nombre: "Pepsi",
            precio: 2000
        },

        {
            nombre: "Agua",
            precio: 1200
        }

    ],


    comida: [

        {
            nombre: "Hamburguesa",
            precio: 4500
        },

        {
            nombre: "Pancho",
            precio: 3000
        },

        {
            nombre: "Sándwich",
            precio: 3500
        },

        {
            nombre: "Empanada",
            precio: 2500
        }

    ],


    golosinas: [

        {
            nombre: "Chocolate",
            precio: 1800
        },

        {
            nombre: "Alfajor",
            precio: 1500
        },

        {
            nombre: "Chupetín",
            precio: 500
        },

        {
            nombre: "Caramelos",
            precio: 300
        }

    ],


    snacks: [

        {
            nombre: "Papas fritas",
            precio: 2500
        },

        {
            nombre: "Palitos",
            precio: 1800
        },

        {
            nombre: "Galletitas",
            precio: 2200
        },

        {
            nombre: "Maní",
            precio: 2000
        }

    ]

};



/* =========================
   CARRITO
========================== */

let carrito = [];



/* =========================
   MOSTRAR CATEGORÍA
========================== */

function mostrarCategoria(categoria) {

    const tabla =
        document.getElementById("tablaProductos");

    const titulo =
        document.getElementById("titulo");


    titulo.innerText =
        categoria.charAt(0).toUpperCase()
        + categoria.slice(1);


    tabla.innerHTML = "";


    productos[categoria].forEach(
        function(producto) {

            const fila =
                document.createElement("tr");


            fila.innerHTML = `

                <td>
                    ${producto.nombre}
                </td>

                <td class="precio">
                    $${producto.precio}
                </td>

                <td>

                    <button
                        class="btn-agregar"
                        onclick="agregarAlCarrito(
                            '${producto.nombre}',
                            ${producto.precio}
                        )"
                    >
                        🛒 Agregar
                    </button>

                </td>

            `;


            tabla.appendChild(fila);

        }
    );

}



/* =========================
   AGREGAR AL CARRITO
========================== */

function agregarAlCarrito(nombre, precio) {

    carrito.push({

        nombre: nombre,

        precio: precio

    });


    actualizarCarrito();

}



/* =========================
   ACTUALIZAR CARRITO
========================== */

function actualizarCarrito() {

    const lista =
        document.getElementById("listaCarrito");

    const totalElemento =
        document.getElementById("total");


    lista.innerHTML = "";


    let total = 0;


    if (carrito.length === 0) {

        lista.innerHTML =
            "<li>El carrito está vacío.</li>";

    }


    carrito.forEach(
        function(producto, indice) {

            total += producto.precio;


            const elemento =
                document.createElement("li");


            elemento.innerHTML = `

                <span>
                    ${producto.nombre}
                    - $${producto.precio}
                </span>

                <button
                    class="btn-eliminar"
                    onclick="eliminarProducto(${indice})"
                >
                    X
                </button>

            `;


            lista.appendChild(elemento);

        }
    );


    totalElemento.innerText =
        "$" + total;

}



/* =========================
   ELIMINAR PRODUCTO
========================== */

function eliminarProducto(indice) {

    carrito.splice(indice, 1);

    actualizarCarrito();

}



/* =========================
   BUSCADOR
========================== */

function buscarProducto() {

    const texto =
        document
        .getElementById("buscador")
        .value
        .toLowerCase()
        .trim();


    const tabla =
        document.getElementById("tablaProductos");

    const titulo =
        document.getElementById("titulo");


    tabla.innerHTML = "";


    if (texto === "") {

        titulo.innerText =
            "Escribe un producto para buscar";

        return;

    }


    let encontrados = [];


    for (
        let categoria in productos
    ) {

        productos[categoria].forEach(
            function(producto) {

                if (
                    producto.nombre
                    .toLowerCase()
                    .includes(texto)
                ) {

                    encontrados.push(producto);

                }

            }
        );

    }


    titulo.innerText =
        "Resultados de búsqueda";


    if (encontrados.length === 0) {

        tabla.innerHTML = `

            <tr>

                <td colspan="3">
                    No se encontró el producto.
                </td>

            </tr>

        `;

        return;

    }


    encontrados.forEach(
        function(producto) {

            const fila =
                document.createElement("tr");


            fila.innerHTML = `

                <td>
                    ${producto.nombre}
                </td>

                <td class="precio">
                    $${producto.precio}
                </td>

                <td>

                    <button
                        class="btn-agregar"
                        onclick="agregarAlCarrito(
                            '${producto.nombre}',
                            ${producto.precio}
                        )"
                    >
                        🛒 Agregar
                    </button>

                </td>

            `;


            tabla.appendChild(fila);

        }
    );

}



/* =========================
   AYUDA
========================== */

function mostrarAyuda() {

    alert(
        "¿Cómo comprar?\n\n" +

        "1. Elige una categoría.\n" +

        "2. Pulsa 'Agregar' en los productos que quieras.\n" +

        "3. Revisa tu carrito.\n" +

        "4. Pulsa 'Finalizar compra por WhatsApp'.\n\n" +

        "Tu pedido se preparará automáticamente."
    );

}



/* =========================
   FINALIZAR COMPRA
========================== */

function finalizarCompra() {


    if (carrito.length === 0) {

        alert(
            "Tu carrito está vacío. " +
            "Agrega algún producto antes de realizar el pedido."
        );

        return;

    }


    let mensaje =
        "Hola! 👋 Quiero realizar el siguiente pedido:%0A%0A";


    let total = 0;


    carrito.forEach(
        function(producto) {

            mensaje +=
                "• " +
                producto.nombre +
                " - $" +
                producto.precio +
                "%0A";


            total += producto.precio;

        }
    );


    mensaje +=
        "%0A💰 Total: $" +
        total;


    mensaje +=
        "%0A%0AGracias!";


    /* Número de WhatsApp */

    const numero =
        "+5492634302101";


    const url =
        "https://wa.me/" +
        numero +
        "?text=" +
        mensaje;


    window.open(
        url,
        "_blank"
    );

}


</script>


</body>

</html>
